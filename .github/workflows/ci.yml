name: CI

on:
  push:
    branches: [main]
  pull_request:

# The reporter targets Java 17, so 17 is the floor and 21 is the current LTS most
# projects consuming it will actually run on. Both must stay green: this library is
# added to someone else's build, and a version-specific break lands in their CI,
# not ours.

# Read-only by default. Nothing here publishes, pushes or comments, and a
# pull request from a fork runs with this same token - so the narrower it is,
# the less a hostile PR can reach. Raise it per job if that ever changes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # The only action here that is not first-party actions/*, so it is the only
      # one a retagged release could reach. Pinned to a commit rather than the
      # moving v4 tag, which had in any case been left behind at 4.4.3.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Unit tests
        run: ./gradlew :m00n-junit-reporter:test --no-daemon

      - name: Build
        run: ./gradlew :m00n-junit-reporter:build --no-daemon -x test

      # Publishing is manual, but a POM that cannot be generated fails at release
      # time rather than here, which is the expensive place to find out.
      - name: Publication metadata resolves
        run: ./gradlew :m00n-junit-reporter:generatePomFileForMavenPublication --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-java-${{ matrix.java }}
          path: m00n-junit-reporter/build/reports/tests/test
          retention-days: 7
